[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-assistant"
version = "0.2.0"
description = "A simple terminal assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.4",
    "typer>=0.29.2,<1.0.0",
]

[project.scripts]
assistant = "terminal_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
